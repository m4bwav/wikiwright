# Runs the helper's tests on the three operating systems it promises, so a change that only works
# on the author's machine cannot land unnoticed.
name: tests
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  suite:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: test suite
        run: python tests/test_wikiwright.py
      - name: the helper answers from a clean checkout
        run: |
          python skills/wikiwright/scripts/wikiwright.py --version
          python skills/wikiwright/scripts/wikiwright.py check tests/fixtures/good-wiki --version 1.2.0
